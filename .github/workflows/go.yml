# This workflow will build a golang project and deploy the compiled binary to GitHub Pages
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and deploy 7z-GUI-Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write      # to deploy to Pages
  id-token: write   # to verify the deployment originates from an appropriate source

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Ensures full history, including tags

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Setup Pages
      uses: actions/configure-pages@v5
    # Extract the Git Version & Commit to define dynamic folder names

    - name: Install Tools
      env:
        GOTOOLCHAIN: auto
      run: |
        sudo apt-get update
        sudo apt-get install -y upx-ucl
        go install github.com/fyne-io/fyne-cross@latest # Use the fyne-cross tool

    - name: Set up Dynamic Folder Names
      run: |
        # Save to GITHUB_ENV so subsequent steps can use these variables
        echo "GIT_TAG=$(git describe --tags --always)" >> $GITHUB_ENV

    - name: Cross-Compile, Optimize, and Compress
      run: |
        mkdir -p ./public

        NAME="7z-GUI-Linux"
        
        archs=("amd64" "386" "arm64")

        for arch in "${archs[@]}"; do
          echo "Building for Linux ${arch}"
                    
          # Use compile instead of linux
          # -ldflags "-s -w" removes debug info and symbol tables
          # -env GOTOOLCHAIN=auto tells the Go tool inside the container that it is allowed to automatically download the required toolchain
          fyne-cross linux \
            --arch ${arch} \
            -env GOTOOLCHAIN=auto \
            --icon "dist/release/icon.png" \
            --ldflags="-s -w -X main.version=${{ env.GIT_TAG }}" \
            --name "${NAME}"
          
          RAW_BINARY="./fyne-cross/bin/linux-${arch}/${NAME}"

          # Safety check: Ensure binary exists before proceeding
          if [ ! -f "${RAW_BINARY}" ]; then
            echo "Error: Binary for ${arch} not found at ${RAW_BINARY}"
            exit 1
          fi
          
          echo "Compressing ${arch} binary with UPX..."
          upx -9 "${RAW_BINARY}"

          # 2. Setup Staging Area
          STAGING_DIR="./staging"
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"
          
          # Copy files
          cp "${RAW_BINARY}" "${STAGING_DIR}/"
          cp ./dist/release/install.sh "${STAGING_DIR}/" || true
          cp ./dist/release/update.sh "${STAGING_DIR}/" || true
          cp ./dist/release/uninstall.sh "${STAGING_DIR}/" || true
          cp ./dist/release/icon.png "${STAGING_DIR}/${NAME}.png" || true
          cp ./dist/release/7z-GUI-Linux.desktop "${STAGING_DIR}/" || true

          # Create Archive
          ZIP_NAME="${NAME}-${arch}-${{ env.GIT_TAG }}.zip"
          echo "Zipping to ${ZIP_NAME}..."
          
          # zip -j ignores folders, putting everything at the root of the zip
          zip -j "./public/${ZIP_NAME}" "${STAGING_DIR}"/*

          # Cleanup for next iteration
          echo "Cleaning up ${arch} files..."
          rm -rf "${STAGING_DIR}"
          rm -rf "./fyne-cross/bin/linux-${arch}" 
        done

    - name: Output the files structure into a JSON file
      run: |
        tree -J public > files.json
        cp -r files.json ./public/
        echo "JSON Manifest generated!"

    - name: Make web pages available
      run: |
        # Ensure dist/pages exists, or handle if it doesn't
        if [ -d "./dist/pages" ]; then
          cp -r ./dist/pages/* ./public/
        fi
        echo "Web assets ready!"

    - name: Upload artifact
      # upload artifact in the build stage, so that it is later on accessible in the deploy stage
      uses: actions/upload-pages-artifact@v3
      with:
        # Upload entire repository
        path: './public'
  
  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4