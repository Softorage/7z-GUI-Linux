# This workflow will build a golang project and deploy the compiled binary to GitHub Pages
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and deploy 7z-GUI-Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write      # to deploy to Pages
  id-token: write   # to verify the deployment originates from an appropriate source

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Ensures full history, including tags

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Setup Pages
      uses: actions/configure-pages@v5
    # Extract the Git Version & Commit to define dynamic folder names

    - name: Install Tools
      env:
        GOTOOLCHAIN: auto
      run: |
        sudo apt-get update
        sudo apt-get install -y upx-ucl
        go install github.com/fyne-io/fyne-cross@latest # Use the fyne-cross tool

    - name: Set up Dynamic Folder Names
      run: |
        # Save to GITHUB_ENV so subsequent steps can use these variables
        echo "GIT_TAG=$(git describe --tags --always)" >> $GITHUB_ENV

    - name: Cross-Compile, Optimize, and Compress
      run: |
        mkdir -p ./public
        
        # Define architectures to build
        # Note: '386' is the Go name for x86 32-bit
        archs=("amd64" "386" "arm64")

        for arch in "${archs[@]}"; do
          echo "Building for Linux $arch"
          
          # 1. Build using fyne-cross
          # -ldflags "-s -w" removes debug info and symbol tables
          fyne-cross linux \
            --arch $arch \
            --ldflags="-s -w -X main.version=${{ env.GIT_TAG }}" \
            --name 7z-GUI-Linux-$arch
          
          # 2. Path where fyne-cross puts the binary
          BINARY_PATH="./fyne-cross/bin/linux-$arch/7z-GUI-Linux-$arch"
          
          # 3. Compress with UPX
          # --ultra-brute gives the smallest possible size
          echo "Compressing $arch binary..."
          upx --ultra-brute "$BINARY_PATH"
          
          # 4. Package into Zip
          ZIP_NAME="7z-GUI-Linux-${{ env.GIT_TAG }}-$arch.zip"
          zip -j "./public/$ZIP_NAME" "$BINARY_PATH"
          
          echo "Finished $arch build: $ZIP_NAME"
        done

    - name: Output the files structure into a JSON file
      run: |
        cd public
        tree -J . > files.json
        echo "JSON Manifest generated!"

    - name: Make web pages available
      run: |
        # Ensure dist/pages exists, or handle if it doesn't
        if [ -d "./dist/pages" ]; then
          cp -r ./dist/pages/* ./public/
        fi
        echo "Web assets ready!"

    - name: Upload artifact
      # upload artifact in the build stage, so that it is later on accessible in the deploy stage
      uses: actions/upload-pages-artifact@v3
      with:
        # Upload entire repository
        path: './public'
  
  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4